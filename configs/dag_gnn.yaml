# DAG-GNN. Values are those of the original DAG_from_GNN/config.py (same for every dataset).
default:
  seed: 42
  no_cuda: true
  epochs: 10
  batch_size: 50
  lr: 0.001
  x_dims: 1
  z_dims: 1
  optimizer: Adam
  graph_threshold: 0.3
  tau_A: 0.0
  lambda_A: 0.0
  c_A: 1
  use_A_connect_loss: 0
  use_A_positiver_loss: 0
  encoder_hidden: 64
  decoder_hidden: 64
  temp: 0.5
  k_max_iter: 10
  encoder: mlp
  decoder: mlp
  no_factor: false
  encoder_dropout: 0.0
  decoder_dropout: 0.0
  h_tol: 1.0e-8
  lr_decay: 200
  gamma: 1.0
  prior: false
