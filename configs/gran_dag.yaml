# GraN-DAG. Values are those stored in the original runs (GraN-DAG-master/experiment*/to-dag/opt.pkl),
# i.e. start_example.sh:  main.py --model NonLinGaussANM --train --to-dag --jac-thresh  (everything else default).
default:
  model: NonLinGaussANM
  pns: false
  train: true
  to_dag: true
  cam_pruning: false
  retrain: false
  random_seed: 42
  # data
  train_samples: 0.8
  test_samples: null
  train_batch_size: 64
  num_train_iter: 10000
  normalize_data: false
  # model
  num_layers: 2
  hid_dim: 10
  nonlin: leaky-relu
  # optimization
  optimizer: rmsprop
  lr: 0.001
  lr_reinit: 0.001
  scale_lr_with_mu: false
  stop_crit_win: 100
  # pns, pruning and thresholding
  pns_thresh: 0.75
  num_neighbors: null
  edge_clamp_range: 0.0001
  cam_pruning_cutoff: [1.0e-6, 4.64158883e-6, 2.15443469e-5, 1.0e-4, 4.64158883e-4,
                       2.15443469e-3, 1.0e-2, 4.64158883e-2, 2.15443469e-1, 1.0]
  # augmented Lagrangian
  omega_lambda: 0.0001
  omega_mu: 0.9
  mu_init: 0.001
  lambda_init: 0.0
  h_threshold: 1.0e-8
  # misc
  norm_prod: paths
  square_prod: false
  jac_thresh: true
  patience: 10
  plot_freq: 10000
  no_w_adjs_log: false
  gpu: false
  float: false
